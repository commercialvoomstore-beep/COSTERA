    <text x="146" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" fill="url(#gold)" stroke="#5E451B" stroke-width="1.6">C</text>
    <text x="144" y="249" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" fill="none" stroke="#FBF0CF" stroke-width="0.7" opacity="0.7">C</text>
    <g stroke="url(#goldSoft)" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M136 238 L160 214"/>
      <path d="M160 238 L136 214"/>
      <path d="M136 214 l-2.5 -9 M141 212 l0 -10 M146 214 l2.5 -9"/>
    </g>
    <ellipse cx="162" cy="211" rx="5.2" ry="7.4" fill="url(#goldSoft)" transform="rotate(45 162 211)"/>
    <g fill="url(#ivory)" stroke="#B9A878" stroke-width="0.8">
      <circle cx="148" cy="196" r="7.2"/>
      <circle cx="138.5" cy="200.5" r="5.6"/>
      <circle cx="157.5" cy="200.5" r="5.6"/>
      <rect x="138.5" y="200" width="19" height="6.5" rx="3.2"/>
    </g>
  </g>

  <!-- Wordmark avec relief -->
  <text x="188" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="1.5" fill="url(#gold)" stroke="#5E451B" stroke-width="1.1">OSTERA</text>
  <text x="187" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="1.5" fill="none" stroke="#FBF0CF" stroke-width="0.5" opacity="0.65">OSTERA</text>

  <!-- Vapeur -->
  <g stroke="url(#goldSoft)" stroke-width="4.2" fill="none" stroke-linecap="round">
    <path d="M236 306 C231 296 240 290 235 279"/>
    <path d="M256 302 C251 290 260 284 255 271"/>
    <path d="M276 306 C271 296 280 290 275 279"/>
  </g>

  <!-- Cloche dorée -->
  <circle cx="256" cy="315" r="6.5" fill="url(#goldSoft)"/>
  <path d="M192 362 C192 328 221 316 256 316 C291 316 320 328 320 362 Z" fill="url(#gold)"/>
  <path d="M210 332 C221 322 238 318 256 318" stroke="#FBF0CF" stroke-width="3.2" fill="none" opacity="0.85" stroke-linecap="round"/>
  <rect x="184" y="360" width="144" height="8.5" rx="4.25" fill="url(#gold)"/>

  <!-- Livre ouvert -->
  <path d="M194 372 C221 361 246 361 256 370 C266 361 291 361 318 372 L318 385 C291 375 266 375 256 383 C246 375 221 375 194 385 Z" fill="url(#ivory)"/>
  <path d="M199 388 C224 379 246 379 256 386 C266 379 288 379 313 388 L313 394 C288 386 266 386 256 392 C246 386 224 386 199 394 Z" fill="#CBBE9F"/>

  <!-- Ornement bas : fleur de lys + rinceaux -->
  <use href="#fleur" transform="translate(256 414) scale(0.85)"/>
  <path d="M208 402 C222 412 238 415 250 410 M304 402 C290 412 274 415 262 410" stroke="url(#goldSoft)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="206" cy="401" r="3.4" fill="url(#goldSoft)"/>
  <circle cx="306" cy="401" r="3.4" fill="url(#goldSoft)"/>
</svg>
