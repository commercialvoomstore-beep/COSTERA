<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="COSTERA">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF0CF"/>
      <stop offset="0.28" stop-color="#E4CB91"/>
      <stop offset="0.55" stop-color="#C8A45D"/>
      <stop offset="0.82" stop-color="#96743A"/>
      <stop offset="1" stop-color="#6E5220"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E3B8"/>
      <stop offset="0.5" stop-color="#D7B671"/>
      <stop offset="1" stop-color="#927038"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A2F"/>
      <stop offset="0.2" stop-color="#F3E3B8"/>
      <stop offset="0.5" stop-color="#C8A45D"/>
      <stop offset="0.8" stop-color="#F3E3B8"/>
      <stop offset="1" stop-color="#8A6A2F"/>
    </linearGradient>
    <radialGradient id="purple" cx="0.5" cy="0.32" r="1">
