      <use href="#leaf" transform="translate(120 448) rotate(16)"/>
      <use href="#leaf" transform="translate(100 420) rotate(34)"/>
      <use href="#leaf" transform="translate(86 386) rotate(52)"/>
      <use href="#leaf" transform="translate(78 348) rotate(68)"/>
      <use href="#leaf" transform="translate(76 308) rotate(84)"/>
      <use href="#leaf" transform="translate(80 268) rotate(98)"/>
      <use href="#leaf" transform="translate(88 232) rotate(112)"/>
      <use href="#leaf" transform="translate(150 470) rotate(4)"/>
      <use href="#leaf" transform="translate(190 482) rotate(-6)"/>
      <use href="#leaf" transform="translate(230 490) rotate(-14)"/>
      <circle cx="96" cy="404" r="4" fill="url(#goldSoft)"/>
      <circle cx="78" cy="328" r="4" fill="url(#goldSoft)"/>
      <circle cx="84" cy="250" r="4" fill="url(#goldSoft)"/>
    </g>
    <g id="fleur">
