      <stop offset="0.45" stop-color="#54258A"/>
      <stop offset="0.8" stop-color="#3A1160"/>
      <stop offset="1" stop-color="#26083F"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F4EBD8"/>
      <stop offset="1" stop-color="#D9CDB2"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C10 -4 22 -4 30 2 C22 8 10 8 0 4 Z" fill="url(#goldSoft)"/>
    </g>
    <g id="branch">
