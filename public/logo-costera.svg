      <path d="M-6 0 C-17 -9 -26 -4 -26 5 C-26 13 -18 17 -9 14 C-4 12 -3 6 -6 0 Z" fill="url(#goldSoft)"/>
      <path d="M6 0 C17 -9 26 -4 26 5 C26 13 18 17 9 14 C4 12 3 6 6 0 Z" fill="url(#goldSoft)"/>
      <rect x="-13" y="13" width="26" height="5.5" rx="2.75" fill="url(#gold)"/>
    </g>
    <g id="scroll">
      <path d="M0 0 C14 -6 26 -2 30 8 C24 6 16 8 12 14 C8 8 4 4 0 0 Z" fill="url(#goldSoft)"/>
      <circle cx="30" cy="8" r="3.2" fill="url(#goldSoft)"/>
    </g>
  </defs>

  <!-- Lauriers -->
  <use href="#branch"/>
  <use href="#branch" transform="translate(512 0) scale(-1 1)"/>

  <!-- Blason : double bordure or -->
  <path d="M256 92 L404 128 V266 C404 372 336 434 256 458 C176 434 108 372 108 266 V128 Z" fill="url(#goldEdge)"/>
  <path d="M256 100 L396 134 V265 C396 366 331 425 256 448 C181 425 116 366 116 265 V134 Z" fill="url(#gold)"/>
  <path d="M256 110 L386 142 V263 C386 356 326 411 256 433 C186 411 126 356 126 263 V142 Z" fill="url(#purple)"/>
  <path d="M256 121 L375 150 V261 C375 347 320 398 256 419 C192 398 137 347 137 261 V150 Z" fill="none" stroke="#E4CB91" stroke-width="2" opacity="0.6"/>

  <!-- Rinceaux intérieurs -->
  <use href="#scroll" transform="translate(146 152)"/>
  <use href="#scroll" transform="translate(366 152) scale(-1 1)"/>
  <use href="#scroll" transform="translate(160 386) rotate(24)"/>
  <use href="#scroll" transform="translate(352 386) scale(-1 1) rotate(24)"/>

  <!-- Toque ivoire volumineuse -->
  <g>
    <circle cx="256" cy="48" r="31" fill="url(#ivory)"/>
    <circle cx="221" cy="58" r="25" fill="url(#ivory)"/>
    <circle cx="291" cy="58" r="25" fill="url(#ivory)"/>
    <circle cx="196" cy="78" r="18" fill="url(#ivory)"/>
    <circle cx="316" cy="78" r="18" fill="url(#ivory)"/>
    <ellipse cx="256" cy="84" rx="55" ry="16" fill="url(#ivory)"/>
    <path d="M212 90 Q256 101 300 90" stroke="#C9BC9C" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M232 44 C234 60 234 74 232 86 M256 38 C256 56 256 72 256 86 M280 44 C278 60 278 74 280 86" stroke="#E0D5BC" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Couronne royale -->
  <g>
    <path d="M200 94 H312 L318 130 H194 Z" fill="url(#gold)"/>
    <path d="M200 94 H312 L314 104 H198 Z" fill="#FBF0CF" opacity="0.85"/>
    <path d="M194 126 H318 L316 132 H196 Z" fill="#6E5220" opacity="0.55"/>
    <use href="#fleur" transform="translate(256 80) scale(0.7)"/>
    <use href="#fleur" transform="translate(212 90) scale(0.42)"/>
    <use href="#fleur" transform="translate(300 90) scale(0.42)"/>
    <circle cx="228" cy="114" r="4" fill="#54258A"/>
    <circle cx="256" cy="114" r="4" fill="#54258A"/>
    <circle cx="284" cy="114" r="4" fill="#54258A"/>
    <circle cx="228" cy="114" r="1.6" fill="#F3E3B8"/>
    <circle cx="256" cy="114" r="1.6" fill="#F3E3B8"/>
    <circle cx="284" cy="114" r="1.6" fill="#F3E3B8"/>
    <use href="#fleur" transform="translate(256 113) scale(0.3)"/>
  </g>

  <!-- Monogramme C : toque + couverts croisés -->
